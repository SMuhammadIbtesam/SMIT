<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body bgcolor="#CCCCCC ">
     <form>
      
          <h1>Enter Personal details</h1><hr><br><br>

          <input  type="text" name="full-name" maxlength="20" placeholder="Enter Your Name"/><br><br>

          <input type="text" name="Father Name" maxlength="20" placeholder="Enter Father Name"/><br><br>

          <input type="Password" name="Password" maxlength="6" placeholder="Enter Password"/><br><br>

          <input type="email" name="email" placeholder="Enter Email"/><br>

           <h3>Gender</h3>
          <input type="radio" name="Gender" value="Male" chacked/>Male <br>

          <input type="radio" name="Gender" value="Female"/>Female<br><br>

           <h3>Select Your Hobbies</h3>
          <input type="checkbox" name="Hobbies" value="Hourse Ride" checked/>Hourse Ride<br>

          <input type="checkbox" name="Hobbies" Value="Painting"/>Painting<br>

          <input type="checkbox" name="Hobbies" value="Cooking"/>Cooking<br><br>

         <select name="Country">
          <option  name="CHINA" checked>CHINA</option>
          <option name="INDIA">INDIA</option>
          <option name="IRAN">IRAN</option>
          <option name="AFGHANISTAN">AFGHINASTAN</option>
        </select><br><br>

          <select name="GAME" multiple>
            <option  name="GTA 5" checked>GTA 5</option>
            <option name="SNOCKER">SNOCKER</option>
            <option name="PATTI">PATTI</option>
            <option name="PUBG">PIBG</option>
           </select><br><br>
               
          <textarea type="text" name="comments" row="3" col="3">Comment Here</textarea>

          <h3>upload your photo</h3>
          <input type="file" name="profile"/><br><br>
          <input type="Submit" name="upload"/>
          <input type="reset" name="reset"/>
     </form>
</body>
</html>
